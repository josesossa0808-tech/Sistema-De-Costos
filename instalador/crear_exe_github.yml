# Crea el ejecutable .exe del Sistema de Costos en GitHub (Windows) cada vez que se sube un cambio.
# El resultado queda en la sección "Releases" del repositorio.
name: Crear ejecutable

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Crear SistemaCostos.exe
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean instalador/SistemaCostos.spec
          xcopy /E /I /Y config dist\SistemaCostos\config
          xcopy /E /I /Y docs dist\SistemaCostos\docs
          mkdir dist\SistemaCostos\database
          copy database\sistema_costos.db dist\SistemaCostos\database\
          mkdir dist\SistemaCostos\logs
          mkdir dist\SistemaCostos\reportes_generados

      - name: Comprimir (versión portable)
        shell: pwsh
        run: Compress-Archive -Path dist\SistemaCostos -DestinationPath SistemaCostos_portable.zip

      - name: Crear instalador (Inno Setup)
        continue-on-error: true
        shell: cmd
        run: |
          choco install innosetup -y --no-progress
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" instalador\SistemaCostos.iss

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SistemaCostos-Windows
          path: |
            SistemaCostos_portable.zip
            instalador/Output/Instalar_SistemaCostos.exe
          if-no-files-found: warn

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sistema de Costos v1.0.${{ github.run_number }}
          make_latest: true
          fail_on_unmatched_files: false
          body: |
            **Sistema de Costos** para Windows (incluye los datos de la empresa Deligaby).
            - **Instalar_SistemaCostos.exe**: instalador; crea el acceso directo en el escritorio.
            - **SistemaCostos_portable.zip**: descomprimir y abrir `SistemaCostos\SistemaCostos.exe`.
            Usuario: admin · Contraseña: Admin123*
          files: |
            instalador/Output/Instalar_SistemaCostos.exe
            SistemaCostos_portable.zip
