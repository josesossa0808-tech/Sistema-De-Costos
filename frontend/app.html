<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de Costos</title>
  <link rel="icon" href="img/icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div class="app">
  <aside class="lateral" id="lateral">
    <div class="logo"><small>Costeo estándar</small><span id="nombre-sistema">Sistema de Costos</span></div>
    <nav class="menu" id="menu" aria-label="Menú principal"></nav>
  </aside>

  <div class="principal">
    <header class="barra">
      <button id="btn-menu" class="btn-chico" type="button" aria-label="Abrir menú">☰</button>
      <div class="selector">
        <label for="sel-empresa">Empresa</label>
        <select id="sel-empresa"></select>
      </div>
      <div class="selector">
        <label for="sel-periodo">Periodo</label>
        <select id="sel-periodo"></select>
      </div>
      <div class="espacio"></div>
      <div class="usuario-chip">
        <span id="u-nombre"></span><span class="rol" id="u-rol"></span>
        <button class="btn-chico" type="button" id="btn-clave" title="Cambiar contraseña">Contraseña</button>
        <button class="btn-chico" type="button" id="btn-salir">Cerrar sesión</button>
      </div>
    </header>
    <main class="contenido" id="contenido"><div class="cargando">Cargando…</div></main>
  </div>
</div>
<div class="avisos" id="avisos" aria-live="polite"></div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/graficos.js"></script>
<script src="js/app.js"></script>
<script src="js/modulos/crud.js"></script>
<script src="js/modulos/dashboard.js"></script>
<script src="js/modulos/produccion.js"></script>
<script src="js/modulos/costos.js"></script>
<script src="js/modulos/reportes.js"></script>
<script src="js/modulos/seguridad.js"></script>
<script src="js/modulos/ayuda.js"></script>
<script>App.iniciar();</script>
</body>
</html>
