<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema de Costos Estándar</title>
<style>
  :root {
    color-scheme: light;
    --fondo: #f4f7fb; --tarjeta: #ffffff; --texto: #1d2733; --suave: #5f6b7a;
    --borde: #dbe3ee; --primario: #1d5fbf; --primario-txt: #ffffff; --sec: #e8eef7;
    --lateral: #1d5fbf; --lateral-txt: #dbe7fb; --lateral-activo: rgba(255,255,255,.2); --lateral-fuerte: #ffffff; --lateral-grupo: #a9c4ef;
    --peligro: #c0392b; --fav: #1e8449; --desf: #c0392b; --aviso: #fff6dd; --aviso-borde: #efd48a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, Arial, sans-serif; background: var(--fondo); color: var(--texto); font-size: 15px; }
  button { background: var(--primario); color: var(--primario-txt); border: 0; padding: 9px 14px; border-radius: 6px; cursor: pointer; font: inherit; }
  button.sec { background: var(--sec); color: var(--texto); }
  button.peligro { background: var(--peligro); color: #fff; }
  input, select { padding: 8px 9px; border: 1px solid var(--borde); border-radius: 6px; width: 100%; font: inherit; background: var(--tarjeta); color: var(--texto); }
  input:disabled { opacity: .6; }
  label { display: block; font-size: 13px; color: var(--suave); }
  label input, label select { margin-top: 4px; }
  .oculto { display: none !important; }
  .error { color: var(--peligro); min-height: 1.2em; margin: 6px 0 0; font-size: 14px; }
  .ok { color: var(--fav); }
  .aviso { background: var(--aviso); border: 1px solid var(--aviso-borde); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; }

  /* ===== Acceso ===== */
  #acceso { display: grid; place-items: center; min-height: 100vh; padding: 16px; }
  .tarjeta { background: var(--tarjeta); padding: 30px; border-radius: 12px; width: 100%; max-width: 390px; box-shadow: 0 6px 24px rgba(0,0,0,.08); border: 1px solid var(--borde); }
  .tarjeta h1 { font-size: 21px; margin: 0 0 4px; }
  .tarjeta .sub { color: var(--suave); margin: 0 0 18px; }
  .tarjeta label { margin-bottom: 10px; }
  .pestanas { display: grid; grid-template-columns: 1fr 1fr; background: var(--sec); border-radius: 8px; padding: 4px; margin-bottom: 18px; }
  .pestanas button { background: transparent; color: var(--suave); }
  .pestanas button.activa { background: var(--tarjeta); color: var(--texto); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .tarjeta form button[type=submit] { width: 100%; margin-top: 6px; }
  .nota { font-size: 12px; color: var(--suave); margin-top: 14px; text-align: center; }

  /* ===== Aplicación con barra lateral ===== */
  #app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
  aside { background: var(--lateral); color: var(--lateral-txt); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .marca { color: var(--lateral-fuerte); font-weight: 700; font-size: 17px; padding: 18px 20px 12px; line-height: 1.3; }
  .marca small { display: block; font-weight: 400; font-size: 12px; color: var(--lateral-txt); }
  .empresa-activa { padding: 0 14px 12px; border-bottom: 1px solid rgba(255,255,255,.2); }
  .empresa-activa span { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--lateral-grupo); padding-left: 4px; }
  .empresa-activa select { margin-top: 4px; background: rgba(255,255,255,.15); color: var(--lateral-fuerte); border-color: rgba(255,255,255,.35); }
  .empresa-activa option { color: #1d2733; }
  .menu { flex: 1; overflow-y: auto; padding: 8px 10px; }
  .grupo { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--lateral-grupo); padding: 14px 10px 4px; }
  .menu button { width: 100%; background: transparent; color: var(--lateral-txt); text-align: left; padding: 8px 12px; border-radius: 7px; font-size: 14px; }
  .menu button:hover { background: rgba(255,255,255,.12); }
  .menu button.activo { background: var(--lateral-activo); color: var(--lateral-fuerte); font-weight: 600; }
  .cuenta { border-top: 1px solid rgba(255,255,255,.2); padding: 12px 20px 16px; font-size: 14px; }
  .cuenta b { color: var(--lateral-fuerte); display: block; }
  .rol { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; background: rgba(255,255,255,.2); margin-top: 4px; }
  .salir { background: transparent; color: var(--lateral-txt); padding: 8px 0 0; display: block; }
  .salir:hover { color: var(--lateral-fuerte); }
  .barra-movil { display: none; }

  main { padding: 26px 28px 60px; max-width: 1200px; width: 100%; }
  h2 { margin: 0 0 4px; }
  h3 { margin: 22px 0 6px; font-size: 16px; }
  .desc { color: var(--suave); margin: 0 0 18px; }
  .formulario { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 10px; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; align-items: end; }
  .formulario .acciones { display: flex; gap: 8px; }
  .tabla { overflow-x: auto; margin-top: 14px; }
  table { width: 100%; border-collapse: collapse; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 10px; overflow: hidden; }
  th, td { padding: 9px 12px; border-bottom: 1px solid var(--borde); text-align: left; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  th { font-size: 12px; color: var(--suave); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.acc { text-align: right; }
  td button { padding: 4px 10px; font-size: 13px; }
  tr.total td { font-weight: 700; background: var(--sec); }
  .fav { color: var(--fav); font-weight: 600; }
  .desf { color: var(--desf); font-weight: 600; }
  .vacio { color: var(--suave); }
  .cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .cifra { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 10px; padding: 14px 16px; }
  .cifra span { color: var(--suave); font-size: 13px; }
  .cifra b { display: block; font-size: 24px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .pasos { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 10px; padding: 6px 18px; }
  .pasos li { padding: 6px 0; }
  .pasos li.hecho { color: var(--suave); text-decoration: line-through; }
  .filtros { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .filtros label { min-width: 220px; }

  @media (max-width: 800px) {
    #app { grid-template-columns: 1fr; }
    .barra-movil { display: flex; align-items: center; gap: 12px; background: var(--lateral); color: var(--lateral-fuerte); padding: 12px 16px; position: sticky; top: 0; z-index: 5; }
    .barra-movil button { background: transparent; color: inherit; padding: 2px 8px; font-size: 22px; line-height: 1; }
    aside { position: fixed; inset: 0 auto 0 0; width: 270px; z-index: 10; transform: translateX(-100%); transition: transform .2s; }
    aside.abierto { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.45); }
    main { padding: 18px 16px 60px; }
  }
</style>
</head>
<body>

<!-- ================= Acceso ================= -->
<section id="acceso">
  <div class="tarjeta">
    <h1>Sistema de Costos Estándar</h1>
    <p class="sub">Materiales, mano de obra, CIF y variaciones</p>
    <div class="pestanas">
      <button type="button" id="tabEntrar" class="activa">Iniciar sesión</button>
      <button type="button" id="tabCrear">Crear cuenta</button>
    </div>
    <form id="formEntrar">
      <label>Usuario <input name="usuario" required autocomplete="username"></label>
      <label>Contraseña <input name="password" type="password" required autocomplete="current-password"></label>
      <button type="submit">Entrar</button>
      <p class="error" id="errEntrar"></p>
    </form>
    <form id="formCrear" class="oculto">
      <label>Nombre completo <input name="nombre" required autocomplete="name"></label>
      <label>Usuario <input name="usuario" required autocomplete="username" minlength="3"></label>
      <label>Contraseña <input name="password" type="password" required autocomplete="new-password" minlength="4"></label>
      <label>Repetir contraseña <input name="password2" type="password" required autocomplete="new-password"></label>
      <button type="submit">Crear mi cuenta</button>
      <p class="error" id="errCrear"></p>
    </form>
    <p class="nota" id="notaAcceso"></p>
  </div>
</section>

<!-- ================= Aplicación ================= -->
<div id="app" class="oculto">
  <div class="barra-movil"><button id="btnMenu" aria-label="Abrir menú">☰</button><strong>Sistema de Costos</strong></div>
  <aside id="lateral">
    <div class="marca">Sistema de Costos<small>Costeo estándar</small></div>
    <div class="empresa-activa"><span>Empresa activa</span><select id="selEmpresa"></select></div>
    <nav class="menu" id="menu"></nav>
    <div class="cuenta">
      <b id="lblNombre"></b><span class="rol" id="lblRol"></span>
      <button class="salir" id="btnSalir">Cerrar sesión →</button>
    </div>
  </aside>
  <main id="vista"></main>
</div>

<script>
// =====================================================================
//  ALMACENAMIENTO (se guarda en el navegador)
// =====================================================================
const CLAVE = 'sistema-costos-v3';
let memoria = null;
function leer() { try { const t = localStorage.getItem(CLAVE); if (t) return JSON.parse(t); } catch (e) {} return memoria; }
function escribir(d) { memoria = d; try { localStorage.setItem(CLAVE, JSON.stringify(d)); } catch (e) {} }
function hash(t) { let h = 5381; for (const c of 'costos::' + t) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return h.toString(16); }

const TABLAS = ['empresas', 'periodos', 'unidades', 'centros', 'productos', 'materiales', 'estMP', 'cargos',
  'trabajadores', 'estMOD', 'cifPres', 'cifReal', 'ordenes', 'consumos'];
let DB = leer() || { sigId: 1, usuarios: [], bitacora: [], empresaActiva: {}, t: {} };
TABLAS.forEach(t => DB.t[t] ||= []);
const T = DB.t;
const guardar = () => escribir(DB);
const nuevoId = () => DB.sigId++;

let sesion = null;
try { const id = Number(sessionStorage.getItem('sesion-costos')); if (id) sesion = DB.usuarios.find(u => u.id === id && u.activo) || null; } catch (e) {}

function registrar(accion, detalle = '') {
  DB.bitacora.unshift({ fecha: new Date().toLocaleString('es-CO'), usuario: sesion ? sesion.usuario : '', accion, detalle: String(detalle) });
  DB.bitacora = DB.bitacora.slice(0, 500); guardar();
}

// =====================================================================
//  UTILIDADES
// =====================================================================
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pesos = (v) => Number(v || 0).toLocaleString('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 2 });
const num = (v, d = 2) => Number(v || 0).toLocaleString('es-CO', { maximumFractionDigits: d });
const n = (v) => Number(v) || 0;
const tipo = (v) => Math.abs(v) < 0.005 ? 'Sin variación' : v < 0 ? 'Favorable' : 'Desfavorable';
const claseTipo = (v) => Math.abs(v) < 0.005 ? '' : v < 0 ? 'fav' : 'desf';
const empresaId = () => sesion && DB.empresaActiva[sesion.id];
const filas = (t) => E[t] && E[t].global ? T[t] : T[t].filter(r => r.empresa_id === empresaId());
const buscar = (t, id) => T[t].find(r => r.id === Number(id));
const nombre = (t, id, campo = 'nombre') => { const r = buscar(t, id); return r ? r[campo] : '—'; };

// Permisos por rol
const esAdmin = () => sesion && sesion.rol === 'Administrador';
const puedeEditar = () => sesion && sesion.rol !== 'Estudiante';
const puedeEliminar = () => esAdmin();

// =====================================================================
//  DEFINICIÓN DE MÓDULOS (formularios y tablas)
// =====================================================================
const opts = (t, etq) => () => filas(t).map(r => [r.id, etq(r)]);
const BASES = ['Horas MOD', 'Horas máquina', 'Unidades producidas'];
const E = {
  empresas: { global: true, titulo: 'Empresas', desc: 'Crear, editar y eliminar empresas con sus datos tributarios.', unico: 'nit',
    campos: [
      { n: 'nit', l: 'NIT', req: 1 }, { n: 'razon_social', l: 'Razón social', req: 1 },
      { n: 'regimen', l: 'Régimen tributario', t: 'select', o: ['Responsable de IVA', 'No responsable de IVA', 'Régimen Simple de Tributación', 'Gran contribuyente'] },
      { n: 'ciiu', l: 'Actividad económica (CIIU)' }, { n: 'retenedor', l: 'Agente retenedor', t: 'select', o: ['No', 'Sí'] },
      { n: 'ciudad', l: 'Ciudad' }, { n: 'direccion', l: 'Dirección' }, { n: 'telefono', l: 'Teléfono' }],
    cols: [['NIT', r => esc(r.nit)], ['Razón social', r => esc(r.razon_social)], ['Régimen', r => esc(r.regimen)],
      ['CIIU', r => esc(r.ciiu)], ['Retenedor', r => esc(r.retenedor)], ['Ciudad', r => esc(r.ciudad)]] },

  periodos: { titulo: 'Periodos contables', desc: 'Periodos en los que se registra la producción y los CIF.',
    campos: [{ n: 'nombre', l: 'Nombre (ej. Enero 2026)', req: 1 }, { n: 'inicio', l: 'Fecha inicio', t: 'date', req: 1 },
      { n: 'fin', l: 'Fecha fin', t: 'date', req: 1 }, { n: 'estado', l: 'Estado', t: 'select', o: ['Abierto', 'Cerrado'] }],
    cols: [['Periodo', r => esc(r.nombre)], ['Inicio', r => esc(r.inicio)], ['Fin', r => esc(r.fin)], ['Estado', r => esc(r.estado)]] },

  unidades: { titulo: 'Unidades de medida', desc: 'Unidades usadas para materiales y productos.', unico: 'codigo',
    campos: [{ n: 'codigo', l: 'Código (ej. KG)', req: 1 }, { n: 'nombre', l: 'Nombre', req: 1 }],
    cols: [['Código', r => esc(r.codigo)], ['Nombre', r => esc(r.nombre)]] },

  centros: { titulo: 'Centros de costos', desc: 'Áreas a las que se asignan los costos.', unico: 'codigo',
    campos: [{ n: 'codigo', l: 'Código', req: 1 }, { n: 'nombre', l: 'Nombre', req: 1 },
      { n: 'tipo', l: 'Tipo', t: 'select', o: ['Producción', 'Servicio', 'Administración'] }],
    cols: [['Código', r => esc(r.codigo)], ['Nombre', r => esc(r.nombre)], ['Tipo', r => esc(r.tipo)]] },

  productos: { titulo: 'Productos', desc: 'Productos que fabrica la empresa.', unico: 'codigo',
    campos: [{ n: 'codigo', l: 'Código', req: 1 }, { n: 'nombre', l: 'Nombre', req: 1 },
      { n: 'unidad_id', l: 'Unidad de medida', t: 'select', ref: 1, o: opts('unidades', r => `${r.codigo} - ${r.nombre}`) }],
    cols: [['Código', r => esc(r.codigo)], ['Producto', r => esc(r.nombre)], ['Unidad', r => esc(nombre('unidades', r.unidad_id, 'codigo'))],
      ['Costo estándar unitario', r => pesos(costoEstandarUnitario(r.id).total), 1]] },

  materiales: { titulo: 'Registro de materiales', desc: 'Materias primas directas con su precio estándar y proveedor.', unico: 'codigo',
    campos: [{ n: 'codigo', l: 'Código del material', req: 1 }, { n: 'descripcion', l: 'Descripción', req: 1 },
      { n: 'unidad_id', l: 'Unidad de medida', t: 'select', ref: 1, o: opts('unidades', r => `${r.codigo} - ${r.nombre}`) },
      { n: 'precio_std', l: 'Precio estándar', t: 'number', req: 1 }, { n: 'proveedor', l: 'Proveedor' },
      { n: 'centro_id', l: 'Centro de costos', t: 'select', ref: 1, o: opts('centros', r => `${r.codigo} - ${r.nombre}`) }],
    cols: [['Código', r => esc(r.codigo)], ['Descripción', r => esc(r.descripcion)], ['Unidad', r => esc(nombre('unidades', r.unidad_id, 'codigo'))],
      ['Precio estándar', r => pesos(r.precio_std), 1], ['Proveedor', r => esc(r.proveedor)], ['Centro de costos', r => esc(nombre('centros', r.centro_id))]] },

  estMP: { titulo: 'Cantidades estándar de materiales', desc: 'Cuánto material se necesita, en estándar, para fabricar una unidad de cada producto.',
    campos: [{ n: 'producto_id', l: 'Producto', t: 'select', ref: 1, req: 1, o: opts('productos', r => `${r.codigo} - ${r.nombre}`) },
      { n: 'material_id', l: 'Material', t: 'select', ref: 1, req: 1, o: opts('materiales', r => `${r.codigo} - ${r.descripcion}`) },
      { n: 'cantidad', l: 'Cantidad estándar por unidad', t: 'number', req: 1 }],
    cols: [['Producto', r => esc(nombre('productos', r.producto_id))], ['Material', r => esc(nombre('materiales', r.material_id, 'descripcion'))],
      ['Cantidad estándar', r => num(r.cantidad, 4), 1], ['Precio estándar', r => pesos(nombre('materiales', r.material_id, 'precio_std')), 1],
      ['Costo estándar', r => pesos(n(r.cantidad) * n(nombre('materiales', r.material_id, 'precio_std'))), 1]] },

  cargos: { titulo: 'Cargos', desc: 'Cargos de los trabajadores de producción.',
    campos: [{ n: 'nombre', l: 'Cargo', req: 1 }, { n: 'descripcion', l: 'Descripción' }],
    cols: [['Cargo', r => esc(r.nombre)], ['Descripción', r => esc(r.descripcion)],
      ['Trabajadores', r => filas('trabajadores').filter(t => t.cargo_id === r.id).length, 1]] },

  trabajadores: { titulo: 'Trabajadores', desc: 'Salarios, prestaciones y cargas laborales. La tarifa por hora se calcula sola.', unico: 'documento',
    campos: [{ n: 'documento', l: 'Documento', req: 1 }, { n: 'nombre', l: 'Nombre', req: 1 },
      { n: 'cargo_id', l: 'Cargo', t: 'select', ref: 1, o: opts('cargos', r => r.nombre) },
      { n: 'salario', l: 'Salario mensual', t: 'number', req: 1 },
      { n: 'prestaciones', l: '% prestaciones y cargas', t: 'number', def: 52.18 },
      { n: 'horas_mes', l: 'Horas laborales al mes', t: 'number', def: 230 }],
    cols: [['Documento', r => esc(r.documento)], ['Nombre', r => esc(r.nombre)], ['Cargo', r => esc(nombre('cargos', r.cargo_id))],
      ['Salario', r => pesos(r.salario), 1], ['Prestaciones', r => pesos(n(r.salario) * n(r.prestaciones) / 100), 1],
      ['Costo mensual', r => pesos(costoMensual(r)), 1], ['Tarifa por hora', r => pesos(tarifaHora(r)), 1]] },

  estMOD: { titulo: 'Estándar de mano de obra', desc: 'Horas estándar y tarifa estándar por hora para cada unidad de producto.',
    arriba: () => { const ts = filas('trabajadores'); if (!ts.length) return '';
      const prom = ts.reduce((s, t) => s + tarifaHora(t), 0) / ts.length;
      return `<div class="aviso">Tarifa promedio por hora de sus trabajadores: <b>${pesos(prom)}</b>. Puede usarla como tarifa estándar.</div>`; },
    campos: [{ n: 'producto_id', l: 'Producto', t: 'select', ref: 1, req: 1, o: opts('productos', r => `${r.codigo} - ${r.nombre}`) },
      { n: 'horas', l: 'Horas estándar MOD por unidad', t: 'number', req: 1 },
      { n: 'tarifa', l: 'Tarifa estándar por hora', t: 'number', req: 1 },
      { n: 'horas_maq', l: 'Horas máquina estándar por unidad', t: 'number', def: 0 }],
    cols: [['Producto', r => esc(nombre('productos', r.producto_id))], ['Horas estándar', r => num(r.horas, 4), 1],
      ['Tarifa estándar', r => pesos(r.tarifa), 1], ['Costo estándar MOD', r => pesos(n(r.horas) * n(r.tarifa)), 1],
      ['Horas máquina', r => num(r.horas_maq, 4), 1]] },

  cifPres: { titulo: 'CIF presupuestado', desc: 'CIF fijos y variables por periodo, base de aplicación y tasa predeterminada.',
    campos: [{ n: 'periodo_id', l: 'Periodo', t: 'select', ref: 1, req: 1, o: opts('periodos', r => r.nombre) },
      { n: 'fijo', l: 'CIF fijo presupuestado', t: 'number', req: 1 },
      { n: 'variable', l: 'CIF variable presupuestado', t: 'number', req: 1 },
      { n: 'base', l: 'Base de aplicación', t: 'select', o: BASES },
      { n: 'capacidad', l: 'Capacidad normal (en la base)', t: 'number', req: 1 }],
    cols: [['Periodo', r => esc(nombre('periodos', r.periodo_id))], ['CIF fijo', r => pesos(r.fijo), 1], ['CIF variable', r => pesos(r.variable), 1],
      ['CIF presupuestado', r => pesos(n(r.fijo) + n(r.variable)), 1], ['Base', r => esc(r.base)], ['Capacidad', r => num(r.capacidad), 1],
      ['Tasa predeterminada', r => pesos(tasas(r).total), 1]] },

  cifReal: { titulo: 'CIF real', desc: 'Costos indirectos realmente causados en cada periodo.',
    campos: [{ n: 'periodo_id', l: 'Periodo', t: 'select', ref: 1, req: 1, o: opts('periodos', r => r.nombre) },
      { n: 'concepto', l: 'Concepto (ej. energía, arriendo)', req: 1 },
      { n: 'tipo', l: 'Tipo', t: 'select', o: ['Variable', 'Fijo'] },
      { n: 'valor', l: 'Valor', t: 'number', req: 1 },
      { n: 'centro_id', l: 'Centro de costos', t: 'select', ref: 1, o: opts('centros', r => `${r.codigo} - ${r.nombre}`) }],
    cols: [['Periodo', r => esc(nombre('periodos', r.periodo_id))], ['Concepto', r => esc(r.concepto)], ['Tipo', r => esc(r.tipo)],
      ['Valor', r => pesos(r.valor), 1], ['Centro de costos', r => esc(nombre('centros', r.centro_id))]] },

  ordenes: { titulo: 'Órdenes de producción', desc: 'Producto, cantidad, fecha, horas de trabajo y estado de cada orden.', unico: 'numero',

// =====================================================================
//  CÁLCULOS DE COSTO ESTÁNDAR
// =====================================================================
const costoMensual = (t) => n(t.salario) * (1 + n(t.prestaciones) / 100);
const tarifaHora = (t) => n(t.horas_mes) ? costoMensual(t) / n(t.horas_mes) : 0;
function tasas(p) {
  const cap = n(p.capacidad);
  return { variable: cap ? n(p.variable) / cap : 0, fija: cap ? n(p.fijo) / cap : 0, total: cap ? (n(p.fijo) + n(p.variable)) / cap : 0 };
}
const presupuestoDe = (periodoId) => filas('cifPres').find(p => p.periodo_id === periodoId);
const estandarMOD = (prodId) => filas('estMOD').find(e => e.producto_id === prodId) || { horas: 0, tarifa: 0, horas_maq: 0 };

function costoEstandarUnitario(prodId) {
  const mp = filas('estMP').filter(e => e.producto_id === prodId).reduce((s, e) => s + n(e.cantidad) * n(nombre('materiales', e.material_id, 'precio_std')), 0);
  const m = estandarMOD(prodId), mod = n(m.horas) * n(m.tarifa);
  // CIF unitario con el presupuesto más reciente
  const pres = filas('cifPres').slice(-1)[0];
  let cif = 0;
  if (pres) { const base = pres.base === 'Horas máquina' ? n(m.horas_maq) : pres.base === 'Unidades producidas' ? 1 : n(m.horas); cif = tasas(pres).total * base; }
  return { mp, mod, cif, total: mp + mod + cif };
}

function baseDeOrden(o, base) {
  const m = estandarMOD(o.producto_id), q = n(o.cantidad);
  if (base === 'Horas máquina') return { std: n(m.horas_maq) * q, real: n(o.horas_maq_reales) };
  if (base === 'Unidades producidas') return { std: q, real: q };
  return { std: n(m.horas) * q, real: n(o.horas_reales) };
}

function calcularOrden(o) {
  const q = n(o.cantidad);
  // --- Materiales ---
  const est = filas('estMP').filter(e => e.producto_id === o.producto_id);
  const cons = filas('consumos').filter(c => c.orden_id === o.id);
  const ids = [...new Set([...est.map(e => e.material_id), ...cons.map(c => c.material_id)])];
  const materiales = ids.map(id => {
    const PE = n(nombre('materiales', id, 'precio_std'));
    const CE = est.filter(e => e.material_id === id).reduce((s, e) => s + n(e.cantidad), 0) * q;
    const usados = cons.filter(c => c.material_id === id);
    const CR = usados.reduce((s, c) => s + n(c.cantidad), 0);
    const costoReal = usados.reduce((s, c) => s + n(c.cantidad) * n(c.precio), 0);
    const PR = CR ? costoReal / CR : 0;
    return { id, nombre: nombre('materiales', id, 'descripcion'), PE, CE, PR, CR, std: CE * PE, real: costoReal,
      varPrecio: costoReal - PE * CR, varCantidad: (CR - CE) * PE };
  });
  // --- Mano de obra ---
  const m = estandarMOD(o.producto_id);
  const HE = n(m.horas) * q, TE = n(m.tarifa), HR = n(o.horas_reales), TR = n(o.tarifa_real);
  // --- CIF ---
  const pres = presupuestoDe(o.periodo_id);
  let cifStd = 0, cifReal = 0, baseStd = 0, baseReal = 0;
  if (pres) {
    const b = baseDeOrden(o, pres.base); baseStd = b.std; baseReal = b.real;
    cifStd = tasas(pres).total * baseStd;
    const realPeriodo = filas('cifReal').filter(c => c.periodo_id === o.periodo_id).reduce((s, c) => s + n(c.valor), 0);
    const totalBaseReal = filas('ordenes').filter(x => x.periodo_id === o.periodo_id).reduce((s, x) => s + baseDeOrden(x, pres.base).real, 0);
    cifReal = totalBaseReal ? realPeriodo * baseReal / totalBaseReal : 0;
  }
  const std = { mp: materiales.reduce((s, x) => s + x.std, 0), mod: HE * TE, cif: cifStd };
  const real = { mp: materiales.reduce((s, x) => s + x.real, 0), mod: HR * TR, cif: cifReal };
  std.total = std.mp + std.mod + std.cif; real.total = real.mp + real.mod + real.cif;
  return { q, materiales, HE, TE, HR, TR, pres, baseStd, baseReal, std, real,
    varTarifa: (TR - TE) * HR, varEficiencia: (HR - HE) * TE };
}

function analisisPeriodo(periodoId) {
  const ords = filas('ordenes').filter(o => o.periodo_id === periodoId).map(o => ({ o, c: calcularOrden(o) }));
  const suma = (f) => ords.reduce((s, x) => s + f(x.c), 0);
  const pres = presupuestoDe(periodoId);
  const r = {
    ords, pres,
    varPrecioMP: suma(c => c.materiales.reduce((s, m) => s + m.varPrecio, 0)),
    varCantidadMP: suma(c => c.materiales.reduce((s, m) => s + m.varCantidad, 0)),
    varTarifa: suma(c => c.varTarifa), varEficiencia: suma(c => c.varEficiencia),
    cifReal: filas('cifReal').filter(c => c.periodo_id === periodoId).reduce((s, c) => s + n(c.valor), 0),
    varPresupuestoCIF: 0, varVolumenCIF: 0, cifAplicado: 0, presFlexible: 0, baseStd: 0,
  };
  if (pres) {
    const t = tasas(pres);
    r.baseStd = suma(c => c.baseStd);
    r.cifAplicado = t.total * r.baseStd;
    r.presFlexible = n(pres.fijo) + t.variable * r.baseStd;
    r.varPresupuestoCIF = r.cifReal - r.presFlexible;
    r.varVolumenCIF = r.presFlexible - r.cifAplicado;
  }
  r.total = r.varPrecioMP + r.varCantidadMP + r.varTarifa + r.varEficiencia + r.varPresupuestoCIF + r.varVolumenCIF;
  return r;
}

function pestana(crear) {
  $('#tabCrear').classList.toggle('activa', crear); $('#tabEntrar').classList.toggle('activa', !crear);
  $('#formCrear').classList.toggle('oculto', !crear); $('#formEntrar').classList.toggle('oculto', crear);

    : 'La primera cuenta que se cree será el Administrador del sistema.';
}

$('#formCrear').onsubmit = (e) => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target)), usuario = d.usuario.trim().toLowerCase();
  if (d.password !== d.password2) { $('#errCrear').textContent = 'Las contraseñas no coinciden'; return; }
  if (DB.usuarios.some(u => u.usuario === usuario)) { $('#errCrear').textContent = 'Ese usuario ya existe, elija otro'; return; }
  const u = { id: nuevoId(), usuario, nombre: d.nombre.trim(), pass: hash(d.password),
    rol: DB.usuarios.length ? 'Usuario' : 'Administrador', activo: true, creado: new Date().toLocaleString('es-CO') };
  DB.usuarios.push(u); guardar(); e.target.reset();
  entrar(u); registrar('Crear cuenta', `${u.usuario} (${u.rol})`);
};
$('#formEntrar').onsubmit = (e) => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  const u = DB.usuarios.find(x => x.usuario === d.usuario.trim().toLowerCase());
  if (!u || u.pass !== hash(d.password)) { $('#errEntrar').textContent = 'Usuario o contraseña incorrectos'; return; }
  if (!u.activo) { $('#errEntrar').textContent = 'Esta cuenta está desactivada. Hable con el administrador.'; return; }
  e.target.reset(); entrar(u); registrar('Inicio de sesión', u.usuario);
};
function entrar(u) {
  sesion = u;
  try { sessionStorage.setItem('sesion-costos', u.id); } catch (e) {}
  if (!buscar('empresas', DB.empresaActiva[u.id])) DB.empresaActiva[u.id] = T.empresas[0] ? T.empresas[0].id : null;

}

};

function campoHTML(c) {
  const req = c.req ? 'required' : '';
  if (c.t === 'select') {
    const lista = typeof c.o === 'function' ? c.o() : c.o.map(x => [x, x]);
    return `<label>${c.l}<select name="${c.n}" ${req}>${c.ref ? '<option value="">— Seleccione —</option>' : ''}${lista.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('')}</select></label>`;
  }
  const tipoInput = c.t === 'number' ? 'number" step="any' : c.t || 'text';
  return `<label>${c.l}<input name="${c.n}" type="${tipoInput}" ${req} value="${c.def ?? ''}"></label>`;
}
function vistaEntidad(k) {
  const e = E[k], V = $('#vista');
  if (!e) return;
  if (!e.global && !empresaId()) { V.innerHTML = `<h2>${e.titulo}</h2><p class="desc">${e.desc}</p>${sinEmpresa()}`; return; }
  const lista = filas(k);
  V.innerHTML = `<h2>${e.titulo}</h2><p class="desc">${e.desc}</p>${e.arriba ? e.arriba() : ''}
    ${puedeEditar() ? `<form id="fEnt" class="formulario"><input type="hidden" name="id">${e.campos.map(campoHTML).join('')}
      <div class="acciones"><button>Guardar</button><button type="button" class="sec oculto" id="btnCancelar">Cancelar</button></div></form>`
      : '<div class="aviso">Su rol es <b>Estudiante</b>: puede consultar, pero no modificar.</div>'}
    <div class="tabla"><table><thead><tr>${e.cols.map(([l, , d]) => `<th class="${d ? 'num' : ''}">${l}</th>`).join('')}<th></th></tr></thead>
    <tbody>${lista.map(r => `<tr>${e.cols.map(([, f, d]) => `<td class="${d ? 'num' : ''}">${f(r)}</td>`).join('')}
      <td class="acc">${puedeEditar() ? `<button class="sec" data-ed="${r.id}">Editar</button>` : ''}
      ${puedeEliminar() ? ` <button class="peligro" data-el="${r.id}">Eliminar</button>` : ''}</td></tr>`).join('')
      || `<tr><td class="vacio" colspan="${e.cols.length + 1}">Aún no hay registros.</td></tr>`}</tbody></table></div>`;

  const f = $('#fEnt');
  if (f) {
    f.onsubmit = (ev) => {
      ev.preventDefault();
      const d = Object.fromEntries(new FormData(f)), id = Number(d.id); delete d.id;
      e.campos.forEach(c => { if (c.t === 'number' || c.ref) d[c.n] = d[c.n] === '' ? (c.ref ? null : 0) : Number(d[c.n]); });
      if (e.unico && lista.some(r => String(r[e.unico]).trim().toLowerCase() === String(d[e.unico]).trim().toLowerCase() && r.id !== id)) {
        alert(`Ya existe un registro con ese ${e.campos.find(c => c.n === e.unico).l.toLowerCase()}.`); return;
      }
      const etiqueta = d[e.campos[0].n];
      if (id) { Object.assign(buscar(k, id), d); registrar(`Editar ${e.titulo.toLowerCase()}`, etiqueta); }
      else {
        const nuevo = { id: nuevoId(), ...d };
        if (!e.global) nuevo.empresa_id = empresaId();
        T[k].push(nuevo); registrar(`Crear en ${e.titulo.toLowerCase()}`, etiqueta);
        if (k === 'empresas') crearDatosIniciales(nuevo);
      }
      guardar(); if (k === 'empresas') pintarLateral(); vistaEntidad(k);
    };
    $('#btnCancelar').onclick = () => vistaEntidad(k);
  }
  V.querySelector('tbody').onclick = (ev) => {
    const ed = ev.target.dataset.ed, el = ev.target.dataset.el;
    if (ed) {
      const r = buscar(k, ed); f.elements.id.value = r.id;
      e.campos.forEach(c => { f.elements[c.n].value = r[c.n] ?? ''; });
      $('#btnCancelar').classList.remove('oculto'); f.scrollIntoView({ behavior: 'smooth' });
    }
    if (el && confirm('¿Eliminar este registro?' + (k === 'empresas' ? '\nSe eliminará también toda la información de la empresa.' : ''))) {
      const r = buscar(k, el);
      T[k] = T[k].filter(x => x.id !== r.id);
      if (k === 'empresas') { TABLAS.forEach(t => { if (t !== 'empresas') T[t] = T[t].filter(x => x.empresa_id !== r.id); });
        Object.keys(DB.empresaActiva).forEach(u => { if (DB.empresaActiva[u] === r.id) DB.empresaActiva[u] = T.empresas[0] ? T.empresas[0].id : null; }); }
      if (k === 'ordenes') T.consumos = T.consumos.filter(c => c.orden_id !== r.id);
      Object.assign(DB.t, T);
      registrar(`Eliminar de ${e.titulo.toLowerCase()}`, r[e.campos[0].n]); guardar();
      if (k === 'empresas') pintarLateral(); vistaEntidad(k);
    }
  };
}

      const q = c.q || 1;
      $('#hojaDet').innerHTML = `
        ${!c.pres ? '<div class="aviso">Este periodo no tiene <b>CIF presupuestado</b>; el CIF aparece en cero.</div>' : ''}
        <div class="cifras">
          <div class="cifra"><span>Producto</span><b style="font-size:18px">${esc(nombre('productos', o.producto_id))}</b></div>
          <div class="cifra"><span>Cantidad producida</span><b>${num(c.q)}</b></div>
          <div class="cifra"><span>Estado</span><b style="font-size:18px">${esc(o.estado)}</b></div>
          <div class="cifra"><span>Costo real unitario</span><b>${pesos(c.real.total / q)}</b></div></div>
        <div class="tabla"><table><thead><tr><th>Elemento del costo</th><th class="num">Estándar unitario</th><th class="num">Estándar total</th><th class="num">Real total</th><th class="num">Diferencia</th><th>Resultado</th></tr></thead><tbody>
          ${fila('Materia prima directa', c.std.mp / q, c.std.mp, c.real.mp)}
          ${fila('Mano de obra directa', c.std.mod / q, c.std.mod, c.real.mod)}
          ${fila('Costos indirectos (CIF)', c.std.cif / q, c.std.cif, c.real.cif)}
          ${fila('Total', c.std.total / q, c.std.total, c.real.total)}</tbody></table></div>
        <h3>Variaciones de la orden</h3>${tablaVariaciones([
          ['Precio de materiales', c.materiales.reduce((s, m) => s + m.varPrecio, 0)],
          ['Cantidad de materiales', c.materiales.reduce((s, m) => s + m.varCantidad, 0)],
          ['Tarifa de mano de obra', c.varTarifa], ['Eficiencia de mano de obra', c.varEficiencia]])}
        <h3>Detalle de materiales</h3>${tablaMateriales(c.materiales)}
        <h3>Detalle de mano de obra</h3>
        <div class="tabla"><table><thead><tr><th class="num">Horas estándar</th><th class="num">Tarifa estándar</th><th class="num">Horas reales</th><th class="num">Tarifa real</th><th class="num">Costo estándar</th><th class="num">Costo real</th></tr></thead>
          <tbody><tr><td class="num">${num(c.HE)}</td><td class="num">${pesos(c.TE)}</td><td class="num">${num(c.HR)}</td><td class="num">${pesos(c.TR)}</td><td class="num">${pesos(c.std.mod)}</td><td class="num">${pesos(c.real.mod)}</td></tr></tbody></table></div>`;
    };
    $('#selOrden').onchange = pintar; pintar();
  },

  variaciones() {
    const V = $('#vista');
    if (!empresaId()) { V.innerHTML = `<h2>Análisis de variaciones</h2>${sinEmpresa()}`; return; }
    const pers = filas('periodos');
    V.innerHTML = `<h2>Análisis de variaciones</h2><p class="desc">Variaciones del periodo: positivo = desfavorable, negativo = favorable.</p>
      ${pers.length ? `<div class="filtros"><label>Periodo<select id="selPer">${pers.map(p => `<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select></label></div><div id="varDet"></div>`
        : '<div class="aviso">Primero cree un periodo en <b>Datos generales → Periodos contables</b>.</div>'}`;
    if (!pers.length) return;
    const pintar = () => {
      const r = analisisPeriodo(Number($('#selPer').value));
      const items = [['Precio de materiales', r.varPrecioMP], ['Cantidad de materiales', r.varCantidadMP],
        ['Tarifa de mano de obra', r.varTarifa], ['Eficiencia de mano de obra', r.varEficiencia],
        ['Presupuesto de CIF', r.varPresupuestoCIF], ['Volumen de CIF', r.varVolumenCIF]];
      const fav = items.filter(([, v]) => v < -0.005).reduce((s, [, v]) => s + v, 0);
      const des = items.filter(([, v]) => v > 0.005).reduce((s, [, v]) => s + v, 0);
      $('#varDet').innerHTML = `
        ${!r.ords.length ? '<div class="aviso">Este periodo no tiene órdenes de producción.</div>' : ''}
        ${!r.pres ? '<div class="aviso">Este periodo no tiene <b>CIF presupuestado</b>; las variaciones de CIF aparecen en cero.</div>' : ''}
        <div class="cifras">
          <div class="cifra"><span>Variación total</span><b class="${claseTipo(r.total)}">${pesos(Math.abs(r.total))}</b><span>${tipo(r.total)}</span></div>
          <div class="cifra"><span>Variaciones favorables</span><b class="fav">${pesos(Math.abs(fav))}</b></div>
          <div class="cifra"><span>Variaciones desfavorables</span><b class="desf">${pesos(des)}</b></div></div>
        ${tablaVariaciones(items)}
        ${r.pres ? `<h3>Datos del CIF</h3><div class="tabla"><table><thead><tr><th>Base</th><th class="num">Tasa predeterminada</th><th class="num">Base estándar permitida</th><th class="num">CIF presupuestado</th><th class="num">Presupuesto flexible</th><th class="num">CIF aplicado</th><th class="num">CIF real</th></tr></thead>
          <tbody><tr><td>${esc(r.pres.base)}</td><td class="num">${pesos(tasas(r.pres).total)}</td><td class="num">${num(r.baseStd)}</td><td class="num">${pesos(n(r.pres.fijo) + n(r.pres.variable))}</td><td class="num">${pesos(r.presFlexible)}</td><td class="num">${pesos(r.cifAplicado)}</td><td class="num">${pesos(r.cifReal)}</td></tr></tbody></table></div>` : ''}
        ${r.ords.length ? `<h3>Por orden de producción</h3><div class="tabla"><table><thead><tr><th>Orden</th><th>Producto</th><th class="num">Precio MP</th><th class="num">Cantidad MP</th><th class="num">Tarifa MOD</th><th class="num">Eficiencia MOD</th></tr></thead><tbody>
          ${r.ords.map(({ o, c }) => { const v = (x) => `<td class="num ${claseTipo(x)}">${pesos(Math.abs(x))}</td>`;
            return `<tr><td>${esc(o.numero)}</td><td>${esc(nombre('productos', o.producto_id))}</td>${v(c.materiales.reduce((s, m) => s + m.varPrecio, 0))}${v(c.materiales.reduce((s, m) => s + m.varCantidad, 0))}${v(c.varTarifa)}${v(c.varEficiencia)}</tr>`; }).join('')}
          </tbody></table></div>` : ''}`;
    };
    $('#selPer').onchange = pintar; pintar();
  },

  usuarios() {
    if (!esAdmin()) return irA('inicio');
    $('#vista').innerHTML = `<h2>Usuarios y roles</h2>
      <p class="desc">Control de permisos: <b>Administrador</b> hace todo (incluye eliminar, usuarios y registro de actividades) · <b>Usuario</b> crea y edita · <b>Estudiante</b> solo consulta.</p>
      <div class="tabla"><table><thead><tr><th>Usuario</th><th>Nombre</th><th>Creado</th><th>Rol</th><th>Estado</th></tr></thead><tbody>
      ${DB.usuarios.map(u => `<tr><td>@${esc(u.usuario)}</td><td>${esc(u.nombre)}</td><td>${esc(u.creado)}</td>
        <td><select data-rol="${u.id}" ${u.id === sesion.id ? 'disabled' : ''}>${['Administrador', 'Usuario', 'Estudiante'].map(r => `<option ${r === u.rol ? 'selected' : ''}>${r}</option>`).join('')}</select></td>
        <td>${u.id === sesion.id ? 'Activo (usted)' : `<button class="sec" data-act="${u.id}">${u.activo ? 'Desactivar' : 'Activar'}</button>`}</td></tr>`).join('')}
      </tbody></table></div>`;
    $('#vista').querySelectorAll('[data-rol]').forEach(s => s.onchange = () => {
      const u = buscar0(s.dataset.rol); u.rol = s.value; registrar('Cambiar rol', `${u.usuario} → ${u.rol}`); guardar();
    });
    $('#vista').querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
      const u = buscar0(b.dataset.act); u.activo = !u.activo; registrar(u.activo ? 'Activar usuario' : 'Desactivar usuario', u.usuario); guardar(); VISTAS.usuarios();
    });
  },

  bitacora() {
    if (!esAdmin()) return irA('inicio');
    $('#vista').innerHTML = `<h2>Registro de actividades</h2><p class="desc">Acciones importantes de todos los usuarios (últimas 500).</p>
      <div class="tabla"><table><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>
      ${DB.bitacora.map(b => `<tr><td>${esc(b.fecha)}</td><td>@${esc(b.usuario)}</td><td>${esc(b.accion)}</td><td>${esc(b.detalle)}</td></tr>`).join('') || '<tr><td colspan="4" class="vacio">Sin actividades.</td></tr>'}
      </tbody></table></div>`;
  },

  cuenta() {
    $('#vista').innerHTML = `<h2>Mi cuenta</h2><p class="desc">Usuario <b>@${esc(sesion.usuario)}</b> · Rol <b>${esc(sesion.rol)}</b></p>
      <form id="fCuenta" class="formulario" style="max-width:820px">
        <label>Nombre completo<input name="nombre" required value="${esc(sesion.nombre)}"></label>
        <label>Contraseña actual<input name="actual" type="password"></label>
        <label>Nueva contraseña<input name="nueva" type="password" minlength="4"></label>
        <div class="acciones"><button>Guardar cambios</button></div></form><p class="error" id="errCuenta"></p>`;
    $('#fCuenta').onsubmit = (ev) => {
      ev.preventDefault(); const d = Object.fromEntries(new FormData(ev.target)), m = $('#errCuenta');
      if (d.nueva) { if (sesion.pass !== hash(d.actual)) { m.className = 'error'; m.textContent = 'La contraseña actual no es correcta'; return; }
        sesion.pass = hash(d.nueva); registrar('Cambiar contraseña'); }
      sesion.nombre = d.nombre.trim(); guardar(); registrar('Actualizar cuenta'); pintarLateral();
      m.className = 'error ok'; m.textContent = 'Cambios guardados';
    };
  },
};
const buscar0 = (id) => DB.usuarios.find(u => u.id === Number(id));

function tablaVariaciones(items) {
  const total = items.reduce((s, [, v]) => s + v, 0);
  const fila = (l, v, t) => `<tr${t ? ' class="total"' : ''}><td>${l}</td><td class="num">${pesos(Math.abs(v))}</td><td class="${claseTipo(v)}">${tipo(v)}</td></tr>`;
  return `<div class="tabla"><table><thead><tr><th>Variación</th><th class="num">Valor</th><th>Resultado</th></tr></thead><tbody>
    ${items.map(([l, v]) => fila(l, v)).join('')}${fila('Variación total', total, 1)}</tbody></table></div>`;
}
function tablaMateriales(ms) {
  if (!ms.length) return '<div class="aviso">Sin materiales: defina las cantidades estándar y registre la materia prima utilizada.</div>';
  const v = (x) => `<td class="num ${claseTipo(x)}">${pesos(Math.abs(x))}</td>`;
  return `<div class="tabla"><table><thead><tr><th>Material</th><th class="num">Cant. estándar</th><th class="num">Precio estándar</th><th class="num">Cant. real</th><th class="num">Precio real</th><th class="num">Var. precio</th><th class="num">Var. cantidad</th></tr></thead><tbody>
    ${ms.map(m => `<tr><td>${esc(m.nombre)}</td><td class="num">${num(m.CE, 4)}</td><td class="num">${pesos(m.PE)}</td><td class="num">${num(m.CR, 4)}</td><td class="num">${pesos(m.PR)}</td>${v(m.varPrecio)}${v(m.varCantidad)}</tr>`).join('')}
    </tbody></table></div>`;
}

// =====================================================================
//  ARRANQUE
// =====================================================================
if (sesion) entrar(sesion); else pestana(DB.usuarios.length === 0);
</script>
</body>
</html>
