<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema de Costos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --fondo: #f4f1ea; --tarjeta: #ffffff; --texto: #1f2a37; --suave: #6f6a60;
    --borde: #e8e2d6; --cabecera: #f7f4ee; --primario: #1b3f73; --primario-txt: #ffffff; --sec: #eee9df;
    --lateral: #1b3f73; --lateral-txt: #d5e0f0; --lateral-activo: rgba(255,255,255,.16); --lateral-fuerte: #ffffff; --lateral-grupo: #93abd0;
    --titulo: #1b3f73; --azul: #1b3f73; --naranja: #c4562b; --verde: #2e6b3f; --dorado: #b8901c;
    --peligro: #c0392b; --fav: #2e6b3f; --desf: #c4462b; --aviso: #fbf3dc; --aviso-borde: #ecd9a0;
    --serif: "Playfair Display", Georgia, "Times New Roman", serif;
    --mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
    --sans: "Inter", "Segoe UI", system-ui, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--sans); background: var(--fondo); color: var(--texto); font-size: 15px; }
  button { background: var(--primario); color: var(--primario-txt); border: 0; padding: 10px 18px; border-radius: 6px; cursor: pointer; font: inherit; font-weight: 500; }
  button:hover { filter: brightness(1.08); }
  button.sec { background: var(--sec); color: var(--texto); }
  button.peligro { background: transparent; color: var(--peligro); border: 1px solid #ebc3bd; }
  input, select { padding: 9px 10px; border: 1px solid var(--borde); border-radius: 6px; width: 100%; font: inherit; font-size: 14px; background: #fff; color: var(--texto); }
  input:focus, select:focus { outline: 2px solid #b9cbe6; border-color: var(--azul); }
  input:disabled { opacity: .6; }
  label { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--suave); }
  label input, label select { margin-top: 6px; text-transform: none; letter-spacing: normal; font-family: var(--sans); }
  .oculto { display: none !important; }
  .error { color: var(--peligro); min-height: 1.2em; margin: 8px 0 0; font-size: 14px; }
  .ok { color: var(--fav); }
  .aviso { background: var(--aviso); border: 1px solid var(--aviso-borde); border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; }

  /* ===== Acceso ===== */
  #acceso { display: grid; place-items: center; min-height: 100vh; padding: 16px; }
  .tarjeta { background: var(--tarjeta); padding: 34px; border-radius: 14px; width: 100%; max-width: 410px; box-shadow: 0 2px 10px rgba(60,50,30,.06); border: 1px solid var(--borde); border-top: 4px solid var(--azul); }
  .tarjeta h1 { font-family: var(--serif); font-size: 30px; margin: 0 0 6px; color: var(--titulo); line-height: 1.15; }
  .tarjeta .sub { font-family: var(--mono); font-size: 12px; color: var(--suave); letter-spacing: .04em; margin: 0 0 22px; }
  .tarjeta label { margin-bottom: 14px; }
  .pestanas { display: grid; grid-template-columns: 1fr 1fr; background: var(--sec); border-radius: 8px; padding: 4px; margin-bottom: 20px; }
  .pestanas button { background: transparent; color: var(--suave); font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 9px; }
  .pestanas button.activa { background: var(--tarjeta); color: var(--titulo); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .tarjeta form button[type=submit] { width: 100%; margin-top: 4px; }
  .nota { font-family: var(--mono); font-size: 11px; color: var(--suave); margin-top: 16px; text-align: center; }

  /* ===== Barra lateral ===== */
  #app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
  aside { background: var(--lateral); color: var(--lateral-txt); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .marca { color: var(--lateral-fuerte); font-family: var(--serif); font-weight: 700; font-size: 22px; padding: 22px 20px 14px; line-height: 1.2; }
  .marca small { display: block; font-family: var(--mono); font-weight: 400; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--lateral-txt); margin-top: 4px; }
  .empresa-activa { padding: 0 14px 14px; border-bottom: 1px solid rgba(255,255,255,.15); }
  .empresa-activa span { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: var(--lateral-grupo); padding-left: 4px; }
  .empresa-activa select { margin-top: 6px; background: rgba(255,255,255,.1); color: var(--lateral-fuerte); border-color: rgba(255,255,255,.25); }
  .empresa-activa option { color: #1f2a37; }
  .menu { flex: 1; overflow-y: auto; padding: 6px 10px 12px; }
  .grupo { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: var(--lateral-grupo); padding: 16px 12px 6px; }
  .menu button { width: 100%; background: transparent; color: var(--lateral-txt); text-align: left; padding: 8px 12px; border-radius: 6px; font-size: 14px; font-weight: 400; }
  .menu button:hover { background: rgba(255,255,255,.08); filter: none; }
  .menu button.activo { background: var(--lateral-activo); color: var(--lateral-fuerte); font-weight: 600; }
  .cuenta { border-top: 1px solid rgba(255,255,255,.15); padding: 14px 20px 18px; font-size: 14px; }
  .cuenta b { color: var(--lateral-fuerte); display: block; }
  .rol { display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; background: rgba(255,255,255,.15); margin-top: 6px; }
  .salir { background: transparent; color: var(--lateral-txt); padding: 10px 0 0; display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  .salir:hover { color: var(--lateral-fuerte); filter: none; }
  .barra-movil { display: none; }

  /* ===== Contenido ===== */
  main { padding: 34px 40px 70px; max-width: 1280px; width: 100%; min-width: 0; }
  h2 { font-family: var(--serif); font-size: 36px; font-weight: 700; color: var(--titulo); margin: 0 0 6px; line-height: 1.15; }
  .desc { font-family: var(--mono); font-size: 13px; color: var(--suave); letter-spacing: .03em; margin: 0 0 26px; }
  h3, .seccion { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--suave);
    margin: 30px 0 12px; padding-left: 10px; border-left: 3px solid var(--titulo); line-height: 1.3; }
  .formulario { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; padding: 22px 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; align-items: end; box-shadow: 0 1px 4px rgba(60,50,30,.04); }
  .formulario .acciones { display: flex; gap: 8px; }
  .tabla { overflow-x: auto; margin-top: 12px; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; padding: 8px 22px 14px; box-shadow: 0 1px 4px rgba(60,50,30,.04); }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 13px 14px; border-bottom: 1px solid var(--borde); text-align: left; white-space: nowrap; }
  thead th { background: var(--cabecera); font-family: var(--mono); font-size: 11px; color: var(--suave); font-weight: 500; text-transform: uppercase; letter-spacing: .12em; border-bottom: 1px solid #ddd5c6; }
  td { font-size: 14px; }
  td:first-child { font-weight: 600; }
  td.num, th.num { text-align: right; }
  td.num { font-family: var(--mono); font-size: 13.5px; }
  td.acc { text-align: right; }
  td button { padding: 5px 12px; font-size: 13px; }
  tbody tr:last-child td { border-bottom: 0; }
  tr.total td { font-weight: 700; background: var(--cabecera); border-top: 2px solid #ddd5c6; }
  .fav { color: var(--fav); font-weight: 600; }
  .desf { color: var(--desf); font-weight: 600; }
  .vacio { color: var(--suave); font-weight: 400 !important; font-family: var(--mono); font-size: 13px; }
  .cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 18px; margin-bottom: 26px; }
  .cifra { background: var(--tarjeta); border: 1px solid var(--borde); border-top: 3px solid var(--azul); border-radius: 12px; padding: 20px 22px; box-shadow: 0 1px 4px rgba(60,50,30,.05); }
  .cifra:nth-child(4n+2) { border-top-color: var(--naranja); } .cifra:nth-child(4n+2) b { color: var(--naranja); }
  .cifra:nth-child(4n+3) { border-top-color: var(--verde); } .cifra:nth-child(4n+3) b { color: var(--verde); }
  .cifra:nth-child(4n+4) { border-top-color: var(--dorado); } .cifra:nth-child(4n+4) b { color: var(--dorado); }
  .cifra span { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--suave); }
  .cifra b { display: block; font-family: var(--serif); font-size: 32px; font-weight: 700; color: var(--azul); margin: 8px 0 6px; line-height: 1.1; }
  .cifra b + span { text-transform: none; letter-spacing: .02em; }
  .cifra b.chico { font-size: 24px; }
  .cifra b.fav { color: var(--fav) !important; } .cifra b.desf { color: var(--desf) !important; }
  .pasos { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; padding: 12px 22px 12px 44px; margin: 0; }
  .pasos li { padding: 8px 0; border-bottom: 1px solid var(--borde); }
  .pasos li:last-child { border-bottom: 0; }
  .pasos li.hecho { color: var(--suave); text-decoration: line-through; }
  .filtros { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .filtros label { min-width: 260px; }

  @media (max-width: 800px) {
    #app { grid-template-columns: 1fr; }
    .barra-movil { display: flex; align-items: center; gap: 12px; background: var(--lateral); color: var(--lateral-fuerte); padding: 12px 16px; position: sticky; top: 0; z-index: 5; font-family: var(--serif); font-size: 18px; }
    .barra-movil button { background: transparent; color: inherit; padding: 2px 8px; font-size: 22px; line-height: 1; }
    aside { position: fixed; inset: 0 auto 0 0; width: 270px; z-index: 10; transform: translateX(-100%); transition: transform .2s; }
    aside.abierto { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.45); }
    main { padding: 22px 16px 60px; }
    h2 { font-size: 28px; }
    .tabla { padding: 4px 10px 10px; }
  }
</style>
</head>
<body>

<!-- ================= Acceso ================= -->
<section id="acceso">
  <div class="tarjeta">
    <h1>Sistema de Costos</h1>
    <p class="sub">Materiales, mano de obra, CIF y variaciones</p>
    <div class="pestanas">
      <button type="button" id="tabEntrar" class="activa">Iniciar sesión</button>
      <button type="button" id="tabCrear">Crear cuenta</button>
    </div>
    <form id="formEntrar">
      <label>Usuario <input name="usuario" required autocomplete="username"></label>
      <label>Contraseña <input name="password" type="password" required autocomplete="current-password"></label>
      <button type="submit">Entrar</button>
      <p class="error" id="errEntrar"></p>
    </form>
    <form id="formCrear" class="oculto">
      <label>Nombre completo <input name="nombre" required autocomplete="name"></label>
      <label>Usuario <input name="usuario" required autocomplete="username" minlength="3"></label>
      <label>Contraseña <input name="password" type="password" required autocomplete="new-password" minlength="4"></label>
      <label>Repetir contraseña <input name="password2" type="password" required autocomplete="new-password"></label>
      <button type="submit">Crear mi cuenta</button>
      <p class="error" id="errCrear"></p>
    </form>
    <p class="nota" id="notaAcceso"></p>
  </div>
</section>

<!-- ================= Aplicación ================= -->
<div id="app" class="oculto">
  <div class="barra-movil"><button id="btnMenu" aria-label="Abrir menú">☰</button><strong>Sistema de Costos</strong></div>
  <aside id="lateral">
    <div class="marca">Sistema de Costos<small>Costeo estándar</small></div>
    <div class="empresa-activa"><span>Empresa activa</span><select id="selEmpresa"></select></div>
    <nav class="menu" id="menu"></nav>
    <div class="cuenta">
      <b id="lblNombre"></b><span class="rol" id="lblRol"></span>
      <button class="salir" id="btnSalir">Cerrar sesión →</button>
    </div>
  </aside>
  <main id="vista"></main>
</div>

// =====================================================================
//  CÁLCULOS DE COSTO ESTÁNDAR
// =====================================================================
const costoMensual = (t) => n(t.salario) * (1 + n(t.prestaciones) / 100);
const tarifaHora = (t) => n(t.horas_mes) ? costoMensual(t) / n(t.horas_mes) : 0;
function tasas(p) {
  const cap = n(p.capacidad);
  return { variable: cap ? n(p.variable) / cap : 0, fija: cap ? n(p.fijo) / cap : 0, total: cap ? (n(p.fijo) + n(p.variable)) / cap : 0 };
}
const presupuestoDe = (periodoId) => filas('cifPres').find(p => p.periodo_id === periodoId);
const estandarMOD = (prodId) => filas('estMOD').find(e => e.producto_id === prodId) || { horas: 0, tarifa: 0, horas_maq: 0 };

function costoEstandarUnitario(prodId) {
  const mp = filas('estMP').filter(e => e.producto_id === prodId).reduce((s, e) => s + n(e.cantidad) * n(nombre('materiales', e.material_id, 'precio_std')), 0);
  const m = estandarMOD(prodId), mod = n(m.horas) * n(m.tarifa);
  // CIF unitario con el presupuesto más reciente
  const pres = filas('cifPres').slice(-1)[0];
  let cif = 0;
  if (pres) { const base = pres.base === 'Horas máquina' ? n(m.horas_maq) : pres.base === 'Unidades producidas' ? 1 : n(m.horas); cif = tasas(pres).total * base; }
  return { mp, mod, cif, total: mp + mod + cif };
}

function baseDeOrden(o, base) {
  const m = estandarMOD(o.producto_id), q = n(o.cantidad);
  if (base === 'Horas máquina') return { std: n(m.horas_maq) * q, real: n(o.horas_maq_reales) };
  if (base === 'Unidades producidas') return { std: q, real: q };
  return { std: n(m.horas) * q, real: n(o.horas_reales) };
}

function calcularOrden(o) {
  const q = n(o.cantidad);
  // --- Materiales ---
  const est = filas('estMP').filter(e => e.producto_id === o.producto_id);
  const cons = filas('consumos').filter(c => c.orden_id === o.id);
  const ids = [...new Set([...est.map(e => e.material_id), ...cons.map(c => c.material_id)])];
  const materiales = ids.map(id => {
    const PE = n(nombre('materiales', id, 'precio_std'));
    const CE = est.filter(e => e.material_id === id).reduce((s, e) => s + n(e.cantidad), 0) * q;
    const usados = cons.filter(c => c.material_id === id);
    const CR = usados.reduce((s, c) => s + n(c.cantidad), 0);
    const costoReal = usados.reduce((s, c) => s + n(c.cantidad) * n(c.precio), 0);
    const PR = CR ? costoReal / CR : 0;
    return { id, nombre: nombre('materiales', id, 'descripcion'), PE, CE, PR, CR, std: CE * PE, real: costoReal,
      varPrecio: costoReal - PE * CR, varCantidad: (CR - CE) * PE };
  });
  // --- Mano de obra ---
  const m = estandarMOD(o.producto_id);
  const HE = n(m.horas) * q, TE = n(m.tarifa), HR = n(o.horas_reales), TR = n(o.tarifa_real);
  // --- CIF ---
  const pres = presupuestoDe(o.periodo_id);
  let cifStd = 0, cifReal = 0, baseStd = 0, baseReal = 0;
  if (pres) {
    const b = baseDeOrden(o, pres.base); baseStd = b.std; baseReal = b.real;
    cifStd = tasas(pres).total * baseStd;
    const realPeriodo = filas('cifReal').filter(c => c.periodo_id === o.periodo_id).reduce((s, c) => s + n(c.valor), 0);
    const totalBaseReal = filas('ordenes').filter(x => x.periodo_id === o.periodo_id).reduce((s, x) => s + baseDeOrden(x, pres.base).real, 0);
    cifReal = totalBaseReal ? realPeriodo * baseReal / totalBaseReal : 0;
  }
  const std = { mp: materiales.reduce((s, x) => s + x.std, 0), mod: HE * TE, cif: cifStd };
  const real = { mp: materiales.reduce((s, x) => s + x.real, 0), mod: HR * TR, cif: cifReal };
  std.total = std.mp + std.mod + std.cif; real.total = real.mp + real.mod + real.cif;
  return { q, materiales, HE, TE, HR, TR, pres, baseStd, baseReal, std, real,
    varTarifa: (TR - TE) * HR, varEficiencia: (HR - HE) * TE };
}

function analisisPeriodo(periodoId) {
  const ords = filas('ordenes').filter(o => o.periodo_id === periodoId).map(o => ({ o, c: calcularOrden(o) }));
  const suma = (f) => ords.reduce((s, x) => s + f(x.c), 0);
  const pres = presupuestoDe(periodoId);
  const r = {
    ords, pres,
    varPrecioMP: suma(c => c.materiales.reduce((s, m) => s + m.varPrecio, 0)),
    varCantidadMP: suma(c => c.materiales.reduce((s, m) => s + m.varCantidad, 0)),
    varTarifa: suma(c => c.varTarifa), varEficiencia: suma(c => c.varEficiencia),
    cifReal: filas('cifReal').filter(c => c.periodo_id === periodoId).reduce((s, c) => s + n(c.valor), 0),
    varPresupuestoCIF: 0, varVolumenCIF: 0, cifAplicado: 0, presFlexible: 0, baseStd: 0,
  };
  if (pres) {
    const t = tasas(pres);
    r.baseStd = suma(c => c.baseStd);
    r.cifAplicado = t.total * r.baseStd;
    r.presFlexible = n(pres.fijo) + t.variable * r.baseStd;
    r.varPresupuestoCIF = r.cifReal - r.presFlexible;
    r.varVolumenCIF = r.presFlexible - r.cifAplicado;
  }
  r.total = r.varPrecioMP + r.varCantidadMP + r.varTarifa + r.varEficiencia + r.varPresupuestoCIF + r.varVolumenCIF;
  return r;
}

function pestana(crear) {
  $('#tabCrear').classList.toggle('activa', crear); $('#tabEntrar').classList.toggle('activa', !crear);
  $('#formCrear').classList.toggle('oculto', !crear); $('#formEntrar').classList.toggle('oculto', crear);
  $('#errEntrar').textContent = $('#errCrear').textContent = '';
  $('#notaAcceso').textContent = DB.usuarios.length ? 'Las cuentas nuevas quedan con rol Usuario. El administrador puede cambiar los roles.'
    : 'La primera cuenta que se cree será el Administrador del sistema.';
  if (DB.usuarios.some(u => u.usuario === 'admin')) $('#notaAcceso').textContent = 'Ingreso de prueba: usuario admin · contraseña Admin123*  (o cree su propia cuenta)';
}
$('#tabEntrar').onclick = () => pestana(false);
$('#tabCrear').onclick = () => pestana(true);

$('#formCrear').onsubmit = (e) => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target)), usuario = d.usuario.trim().toLowerCase();
  if (d.password !== d.password2) { $('#errCrear').textContent = 'Las contraseñas no coinciden'; return; }
  if (DB.usuarios.some(u => u.usuario === usuario)) { $('#errCrear').textContent = 'Ese usuario ya existe, elija otro'; return; }
  const u = { id: nuevoId(), usuario, nombre: d.nombre.trim(), pass: hash(d.password),
    rol: DB.usuarios.length ? 'Usuario' : 'Administrador', activo: true, creado: new Date().toLocaleString('es-CO') };
  DB.usuarios.push(u); guardar(); e.target.reset();
  entrar(u); registrar('Crear cuenta', `${u.usuario} (${u.rol})`);
};
$('#formEntrar').onsubmit = (e) => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  const u = DB.usuarios.find(x => x.usuario === d.usuario.trim().toLowerCase());
  if (!u || u.pass !== hash(d.password)) { $('#errEntrar').textContent = 'Usuario o contraseña incorrectos'; return; }
  if (!u.activo) { $('#errEntrar').textContent = 'Esta cuenta está desactivada. Hable con el administrador.'; return; }
  e.target.reset(); entrar(u); registrar('Inicio de sesión', u.usuario);
};
function entrar(u) {
  sesion = u;
  try { sessionStorage.setItem('sesion-costos', u.id); } catch (e) {}
  if (!buscar('empresas', DB.empresaActiva[u.id])) DB.empresaActiva[u.id] = T.empresas[0] ? T.empresas[0].id : null;
  $('#acceso').classList.add('oculto'); $('#app').classList.remove('oculto');
  pintarLateral(); irA('inicio');
}
$('#btnSalir').onclick = () => {
  registrar('Cierre de sesión'); sesion = null;
  try { sessionStorage.removeItem('sesion-costos'); } catch (e) {}
  $('#app').classList.add('oculto'); $('#acceso').classList.remove('oculto'); pestana(false);
};

function vistaEntidad(k) {

      $('#btnCancelar').classList.remove('oculto'); f.scrollIntoView({ behavior: 'smooth' });

      const r = buscar(k, el);
      T[k] = T[k].filter(x => x.id !== r.id);

          <div class="cifra"><span>Variaciones desfavorables</span><b class="desf">${pesos(des)}</b></div></div>
        ${tablaVariaciones(items)}
        ${r.pres ? `<h3>Datos del CIF</h3><div class="tabla"><table><thead><tr><th>Base</th><th class="num">Tasa predeterminada</th><th class="num">Base estándar permitida</th><th class="num">CIF presupuestado</th><th class="num">Presupuesto flexible</th><th class="num">CIF aplicado</th><th class="num">CIF real</th></tr></thead>
          <tbody><tr><td>${esc(r.pres.base)}</td><td class="num">${pesos(tasas(r.pres).total)}</td><td class="num">${num(r.baseStd)}</td><td class="num">${pesos(n(r.pres.fijo) + n(r.pres.variable))}</td><td class="num">${pesos(r.presFlexible)}</td><td class="num">${pesos(r.cifAplicado)}</td><td class="num">${pesos(r.cifReal)}</td></tr></tbody></table></div>` : ''}
        ${r.ords.length ? `<h3>Por orden de producción</h3><div class="tabla"><table><thead><tr><th>Orden</th><th>Producto</th><th class="num">Precio MP</th><th class="num">Cantidad MP</th><th class="num">Tarifa MOD</th><th class="num">Eficiencia MOD</th></tr></thead><tbody>
          ${r.ords.map(({ o, c }) => { const v = (x) => `<td class="num ${claseTipo(x)}">${pesos(Math.abs(x))}</td>`;
            return `<tr><td>${esc(o.numero)}</td><td>${esc(nombre('productos', o.producto_id))}</td>${v(c.materiales.reduce((s, m) => s + m.varPrecio, 0))}${v(c.materiales.reduce((s, m) => s + m.varCantidad, 0))}${v(c.varTarifa)}${v(c.varEficiencia)}</tr>`; }).join('')}
          </tbody></table></div>` : ''}`;
    };
    $('#selPer').onchange = pintar; pintar();
  },

  usuarios() {
    if (!esAdmin()) return irA('inicio');
    $('#vista').innerHTML = `<h2>Usuarios y roles</h2>
      <p class="desc">Control de permisos: <b>Administrador</b> hace todo (incluye eliminar, usuarios y registro de actividades) · <b>Usuario</b> crea y edita · <b>Estudiante</b> solo consulta.</p>
      <div class="tabla"><table><thead><tr><th>Usuario</th><th>Nombre</th><th>Creado</th><th>Rol</th><th>Estado</th></tr></thead><tbody>
      ${DB.usuarios.map(u => `<tr><td>@${esc(u.usuario)}</td><td>${esc(u.nombre)}</td><td>${esc(u.creado)}</td>
        <td><select data-rol="${u.id}" ${u.id === sesion.id ? 'disabled' : ''}>${['Administrador', 'Usuario', 'Estudiante'].map(r => `<option ${r === u.rol ? 'selected' : ''}>${r}</option>`).join('')}</select></td>
        <td>${u.id === sesion.id ? 'Activo (usted)' : `<button class="sec" data-act="${u.id}">${u.activo ? 'Desactivar' : 'Activar'}</button>`}</td></tr>`).join('')}
      </tbody></table></div>`;
    $('#vista').querySelectorAll('[data-rol]').forEach(s => s.onchange = () => {
      const u = buscar0(s.dataset.rol); u.rol = s.value; registrar('Cambiar rol', `${u.usuario} → ${u.rol}`); guardar();
    });
    $('#vista').querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
      const u = buscar0(b.dataset.act); u.activo = !u.activo; registrar(u.activo ? 'Activar usuario' : 'Desactivar usuario', u.usuario); guardar(); VISTAS.usuarios();
    });
  },

  bitacora() {
    if (!esAdmin()) return irA('inicio');
    $('#vista').innerHTML = `<h2>Registro de actividades</h2><p class="desc">Acciones importantes de todos los usuarios (últimas 500).</p>
      <div class="tabla"><table><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>
      ${DB.bitacora.map(b => `<tr><td>${esc(b.fecha)}</td><td>@${esc(b.usuario)}</td><td>${esc(b.accion)}</td><td>${esc(b.detalle)}</td></tr>`).join('') || '<tr><td colspan="4" class="vacio">Sin actividades.</td></tr>'}
      </tbody></table></div>`;
  },

  cuenta() {
    $('#vista').innerHTML = `<h2>Mi cuenta</h2><p class="desc">Usuario <b>@${esc(sesion.usuario)}</b> · Rol <b>${esc(sesion.rol)}</b></p>
      <form id="fCuenta" class="formulario" style="max-width:820px">
        <label>Nombre completo<input name="nombre" required value="${esc(sesion.nombre)}"></label>
        <label>Contraseña actual<input name="actual" type="password"></label>
        <label>Nueva contraseña<input name="nueva" type="password" minlength="4"></label>
        <div class="acciones"><button>Guardar cambios</button></div></form><p class="error" id="errCuenta"></p>`;
    $('#fCuenta').onsubmit = (ev) => {
      ev.preventDefault(); const d = Object.fromEntries(new FormData(ev.target)), m = $('#errCuenta');
      if (d.nueva) { if (sesion.pass !== hash(d.actual)) { m.className = 'error'; m.textContent = 'La contraseña actual no es correcta'; return; }
        sesion.pass = hash(d.nueva); registrar('Cambiar contraseña'); }
      sesion.nombre = d.nombre.trim(); guardar(); registrar('Actualizar cuenta'); pintarLateral();
      m.className = 'error ok'; m.textContent = 'Cambios guardados';
    };
  },
};
const buscar0 = (id) => DB.usuarios.find(u => u.id === Number(id));

function tablaVariaciones(items) {
  const total = items.reduce((s, [, v]) => s + v, 0);
  const fila = (l, v, t) => `<tr${t ? ' class="total"' : ''}><td>${l}</td><td class="num">${pesos(Math.abs(v))}</td><td class="${claseTipo(v)}">${tipo(v)}</td></tr>`;
  return `<div class="tabla"><table><thead><tr><th>Variación</th><th class="num">Valor</th><th>Resultado</th></tr></thead><tbody>
    ${items.map(([l, v]) => fila(l, v)).join('')}${fila('Variación total', total, 1)}</tbody></table></div>`;
}
function tablaMateriales(ms) {
  if (!ms.length) return '<div class="aviso">Sin materiales: defina las cantidades estándar y registre la materia prima utilizada.</div>';
  const v = (x) => `<td class="num ${claseTipo(x)}">${pesos(Math.abs(x))}</td>`;
  return `<div class="tabla"><table><thead><tr><th>Material</th><th class="num">Cant. estándar</th><th class="num">Precio estándar</th><th class="num">Cant. real</th><th class="num">Precio real</th><th class="num">Var. precio</th><th class="num">Var. cantidad</th></tr></thead><tbody>
    ${ms.map(m => `<tr><td>${esc(m.nombre)}</td><td class="num">${num(m.CE, 4)}</td><td class="num">${pesos(m.PE)}</td><td class="num">${num(m.CR, 4)}</td><td class="num">${pesos(m.PR)}</td>${v(m.varPrecio)}${v(m.varCantidad)}</tr>`).join('')}
    </tbody></table></div>`;
}

// =====================================================================
//  ARRANQUE
// =====================================================================
if (sesion) entrar(sesion); else pestana(DB.usuarios.length === 0);
</script>
</body>
</html>
