; =====================================================================
;  SISTEMA DE COSTOS - Archivo de configuración
;  Edite este archivo con el Bloc de notas y reinicie el sistema.
; =====================================================================

[servidor]
; Dirección y puerto locales donde se ejecuta el sistema
host = 127.0.0.1
puerto = 5000
; Abrir el navegador automáticamente al iniciar (si / no)
abrir_navegador = no
; Modo depuración: solo para desarrollo (si / no)
depuracion = no

[base_datos]
; motor: sqlite (predeterminado: no requiere instalar nada; la base es un archivo)
;        mysql  (opcional: requiere MySQL Server 8 y los datos de conexión de abajo)
motor = sqlite
; --- Solo si motor = mysql ---
host = 127.0.0.1
puerto = 3306
usuario = root
contrasena =
nombre_bd = sistema_costos
; Crea la base de datos y las tablas si no existen (si / no)
crear_automaticamente = si
; Archivo de la base de datos SQLite (copie este archivo para hacer respaldos)
archivo_sqlite = /kosto/datos/sistema_costos.db
; Carpeta de los programas de MySQL (mysqldump) para las copias de seguridad; la llena el instalador
carpeta_mysql_bin =

[seguridad]
; Duración de la sesión en minutos
duracion_sesion_min = 480
; Intentos de inicio de sesión fallidos antes de bloquear la cuenta
intentos_maximos = 5
; Minutos de bloqueo tras superar los intentos
minutos_bloqueo = 15
; Longitud mínima de contraseña
longitud_minima_contrasena = 8
; Permitir que cualquier persona cree su cuenta desde la pantalla de inicio (si / no)
permitir_registro = si
; Rol asignado a las cuentas creadas desde el registro (administrador / usuario / estudiante)
rol_registro = usuario

[administrador_inicial]
; Se crea solo la primera vez. CAMBIE LA CONTRASEÑA al ingresar.
usuario = admin
contrasena = Admin123*
nombre = Administrador del sistema
correo = admin@sistemacostos.local

[sistema]
nombre = Kosto
moneda = COP
decimales = 2
; Horas laborales mensuales por defecto para calcular la tarifa por hora
horas_laborales_mes = 192
; Carpeta donde se guardan los reportes exportados
carpeta_reportes = reportes_generados
; Carpeta de archivos de registro (logs)
carpeta_logs = logs
